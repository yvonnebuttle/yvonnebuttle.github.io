<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(Your Name)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #3d3020;
            max-width: 650px;
            margin: 0 auto;
            padding: 60px 20px;
            background: #f5f1e8;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #2d2416;
        }
        
        h2 {
            font-size: 18px;
            font-weight: 600;
            margin-top: 40px;
            margin-bottom: 15px;
            color: #2d2416;
        }
        
        p {
            margin-bottom: 15px;
            color: #4a3f2a;
        }
        
        a {
            color: #8b6914;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-bottom 0.2s ease;
        }
        
        a:hover {
            border-bottom: 1px solid #8b6914;
            text-decoration: none;
        }
        
        .section-links {
            margin-top: 40px;
            margin-bottom: 40px;
            padding: 20px 0;
            border-top: 1px solid #d4c5a9;
            border-bottom: 1px solid #d4c5a9;
        }
        
        .section-links a {
            margin-right: 20px;
            font-size: 15px;
            color: #6b5d3f;
        }
        
        .section-links a:hover {
            color: #8b6914;
        }
        
        .contact {
            margin-top: 40px;
            font-size: 15px;
            padding-top: 20px;
            border-top: 1px solid #d4c5a9;
        }
        
        .contact a {
            margin-right: 15px;
            color: #6b5d3f;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 40px 15px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            .section-links a {
                display: inline-block;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <h1>(Yvonne Buttle)</h1>
    
    <p>(Introduction paragraph)</p>
    
    <p>(Second paragraph about what you do)</p>
    
    <div class="section-links">
        <a href="writing.html">Writing</a>
        <a href="doing.html">Doing</a>
        <a href="thinking.html">Thinking</a>
        <a href="reading.html">Reading</a>
    </div>
    
    <h2>what I'm up to</h2>
    <p>(What you're currently working on or interested in)</p>
    
    <h2>about me</h2>
    <p>(Brief background information)</p>
    
    <div class="contact">
        <a href="mailto:(your.email@example.com)">Email</a>
        <a href="(twitter link)">Twitter</a>
        <a href="(github link)">GitHub</a>
        <a href="(linkedin link)">LinkedIn</a>
    </div>
</body>
</html>
