title: "Yvonne Buttle"
description: "Personal website of Yvonne Buttle"
baseurl: "" # leave empty if using yvonnebuttle.github.io
url: "https://yvonnebuttle.github.io"
remote_theme: "pages-themes/minimal@v0.2.0"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

author:
  name: "Yvonne Buttle"
  avatar: "/assets/images/strawberry.ico"
  bio: "" #fill this in
  location: "Ireland"

# Default settings for pages
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: false

# Markdown settings
markdown: kramdown
highlighter: rouge

# Navigation menu (linked to _data/navigation.yml)
include: ["_pages"]
