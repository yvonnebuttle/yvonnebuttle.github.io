<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Writing - Yvonne Buttle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #3d3020;
            max-width: 650px;
            margin: 0 auto;
            padding: 60px 20px;
            background: #f5f1e8;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #2d2416;
        }
        
        p {
            margin-bottom: 15px;
            color: #4a3f2a;
        }
        
        a {
            color: #8b6914;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-bottom 0.2s ease;
        }
        
        a:hover {
            border-bottom: 1px solid #8b6914;
            text-decoration: none;
        }
        
        .back-link {
            margin-bottom: 40px;
            color: #6b5d3f;
        }
        
        .post {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid #d4c5a9;
        }
        
        .post:last-child {
            border-bottom: none;
        }
        
        .post h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2d2416;
        }
        
        .post .date {
            color: #7a6b4d;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .post .description {
            color: #4a3f2a;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 40px 15px;
            }
            
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="back-link">
        <a href="index.html">← Back</a>
    </div>

    <h1>writing</h1>
    
    <p>some things I have written</p>
    
    <div class="post">
        <h3><a href="#">prose</a></h3>
        <p class="description">like a young James Joyce</p>
    </div>
    
    <div class="post">
        <h3><a href="#">short essays</a></h3>
        <p class="description">tangled chains of thought</p>
    </div>
    
    <div class="post">
        <h3><a href="#">research</a></h3>
        <p class="description">medical things</p>
    </div>
</body>
</html>
